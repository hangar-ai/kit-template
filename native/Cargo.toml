[package]
name = "my-kit-tab"
description = "The panes tab of the kit template: Rust, built to WebAssembly"
version = "0.1.0"
edition = "2024"
publish = false

# A cdylib is the module Hangar loads (tabs/panes.wasm); the rlib is for
# `cargo test`, which runs the tab on the host, with no Hangar and no WebAssembly.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# From git until a release tag holds the SDK. Cargo.lock pins the commit, so a
# build is the same build tomorrow; `cargo update` moves it on purpose.
hangar-kit-sdk = { git = "https://github.com/hangar-ai/hangar", branch = "feat/native-rust" }

[dev-dependencies]
serde_json = "1"

# A small module opens sooner. None of this is required.
[profile.release]
opt-level = "s"
lto = true
strip = true
