<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bench</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      iframe {
        display: block;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!--
      Hangar's window, in small: the tab in a sandboxed frame, as Hangar frames it, spoken to by
      postMessage. Only the answers are fake. index.html?state=list&scheme=dark&locale=en
    -->
    <iframe id="tab" sandbox="allow-scripts" title="The tab"></iframe>
    <script src="/kit/test/fake-hangar.js"></script>
    <script src="/kit/bench/states.js"></script>
    <script>
      const asked = new URLSearchParams(location.search);
      const frame = document.getElementById("tab");
      const fake = window.createFakeHangar(window.BENCH_STATES[asked.get("state") ?? "list"]);
      // On the frame, not the window: a headless browser's window is 500 px wide at least.
      frame.style.width = `${Number(asked.get("width")) || 980}px`;
      frame.style.height = "100%";

      addEventListener("message", async ({ source, data }) => {
        if (source !== frame.contentWindow || data?.hangar !== 1 || data.id === undefined) return;
        const answer = { hangar: 1, id: data.id };
        try {
          answer.result = await fake.call(data.method, data.params);
        } catch (error) {
          answer.error = { code: error.code, message: error.message };
        }
        frame.contentWindow.postMessage(answer, "*");
      });

      frame.addEventListener("load", () => {
        const theme = { scheme: asked.get("scheme") ?? "dark", locale: asked.get("locale") ?? "en", tokens: {} };
        frame.contentWindow.postMessage({ hangar: 1, event: "theme", data: theme }, "*");
      });

      frame.src = `/kit/${asked.get("entry") ?? "tabs/panes/index.html"}`;
    </script>
  </body>
</html>
